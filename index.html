
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        .report-table {
            width: 100%;
            table-layout: fixed;
        }

        @media screen and (max-width: 600px) {
            .report-wrapper {
                padding: 12px 8px !important;
            }

            .report-card {
                padding: 16px !important;
            }

            .report-header h1 {
                font-size: 22px !important;
            }

            .report-table {
                font-size: 12px !important;
            }

            .report-table th,
            .report-table td {
                padding: 7px 5px !important;
                overflow-wrap: anywhere;
            }
        }
    </style>
    <title>Head of the Lake Volunteer Report</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    font-family: Arial, Helvetica, sans-serif;
    color: #222222;
">

<div style="
    max-width: 760px;
    margin: 0 auto;
    padding: 30px 20px;
" class="report-wrapper">

    <div style="
        background-color: #ffffff;
        padding: 30px;
        border: 1px solid #dddddd;
    " class="report-card">

        <table width="100%" cellpadding="0" cellspacing="0" class="report-header">
            <tr>
                <td width="78" style="vertical-align: middle;">
                    <img src="HOTL%20logo%20round.jpg"
                         alt="Head of the Lake logo"
                         width="68"
                         height="68"
                         style="display: block;">
                </td>
                <td style="vertical-align: middle;">
                    <h1 style="
                        margin-top: 0;
                        margin-bottom: 5px;
                        font-size: 26px;
                    ">
                        Head of the Lake Volunteer Report
                    </h1>

                    <p style="
                        margin-top: 0;
                        margin-bottom: 0;
                        color: #666666;
                        font-size: 14px;
                    ">
                       Updated November 12, 2026 at 2:04 AM PT
                    </p>
                </td>
            </tr>
        </table>

        <div style="
            margin: 25px 0;
            padding: 18px;
            background-color: #f3f6f8;
        ">
            <div style="
                font-size: 28px;
                font-weight: bold;
                margin-bottom: 4px;
            ">
                0 volunteer positions remain
            </div>

            <div style="
                font-size: 15px;
                color: #555555;
            ">
                0 of 0 positions filled
                (0%)
            </div>
        </div>

        <p style="
            margin: 0 0 12px;
            font-size: 14px;
            color: #555555;
        ">
            Click on a volunteer area below to sign up.
        </p>

        <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            class="report-table"
            style="
                border-collapse: collapse;
                font-size: 14px;
            "
        >

            <thead>
                <tr style="background-color: #eeeeee;">
                    <th style="
                        padding: 10px 12px;
                        text-align: left;
                        border-bottom: 2px solid #cccccc;
                    ">
                        Volunteer Area
                    </th>

                    <th style="
                        padding: 10px 12px;
                        text-align: center;
                        border-bottom: 2px solid #cccccc;
                    ">
                        Filled
                    </th>

                    <th style="
                        padding: 10px 12px;
                        text-align: center;
                        border-bottom: 2px solid #cccccc;
                    ">
                        Open
                    </th>

                    <th style="
                        padding: 10px 12px;
                        text-align: center;
                        border-bottom: 2px solid #cccccc;
                    ">
                        Total
                    </th>

                    <th style="
                        padding: 10px 12px;
                        text-align: center;
                        border-bottom: 2px solid #cccccc;
                    ">
                        Filled %
                    </th>
                </tr>
            </thead>

            <tbody>
                
            </tbody>

            <tfoot>
                <tr style="font-weight: bold; background-color: #f3f3f3;">
                    <td style="padding: 10px 12px;">
                        TOTAL
                    </td>

                    <td style="padding: 10px 12px; text-align: center;">
                        0
                    </td>

                    <td style="padding: 10px 12px; text-align: center;">
                        0
                    </td>

                    <td style="padding: 10px 12px; text-align: center;">
                        0
                    </td>

                    <td style="padding: 10px 12px; text-align: center;">
                        0%
                    </td>
                </tr>
            </tfoot>

        </table>

        

    </div>

</div>

</body>
</html>
